<!doctype html><html><head><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head><body class="p-6">
<form onsubmit="event.preventDefault(); if(!email.value.includes('@')) alert('Error!')">
<input id="email" placeholder="Email" class="border p-2 block"><textarea placeholder="Message" class="border p-2 block mt-2"></textarea>
<button class="bg-black text-white px-4 py-2 mt-2">Send</button></form></body></html>
