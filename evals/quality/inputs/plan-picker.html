<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a plan · Sprout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
<style type="text/tailwindcss">
  /* Brand tokens for Sprout. Webfonts come from the @import in fonts.css, not from here. */
  @theme {
    --color-brand: #0b6e4f;
    --color-brand-soft: #d6f5e6;
  }
</style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
<main class="mx-auto max-w-3xl p-6">
  <h1 class="text-3xl font-semibold">Choose a plan</h1>
  <p class="mt-2 text-gray-600">You can change or cancel any time.</p>

  <form class="mt-8" action="/checkout">
    <fieldset>
      <legend class="sr-only">Plan</legend>
      <div class="grid gap-4 sm:grid-cols-3">
        <label class="relative flex cursor-pointer flex-col gap-2 rounded-xl border border-gray-300 bg-white p-5 has-checked:border-brand has-checked:bg-brand-soft">
          <input type="radio" name="plan" value="seed" class="peer sr-only">
          <span class="material-symbols-outlined hidden absolute right-4 top-4 text-brand peer-checked:inline">check_circle</span>
          <span class="text-lg font-semibold">Seed</span>
          <span class="text-2xl font-bold">Free</span>
          <span class="text-sm text-gray-600">1 garden, basic reminders</span>
        </label>
        <label class="relative flex cursor-pointer flex-col gap-2 rounded-xl border border-gray-300 bg-white p-5 has-checked:border-brand has-checked:bg-brand-soft">
          <input type="radio" name="plan" value="sprout" class="peer sr-only" checked>
          <span class="material-symbols-outlined hidden absolute right-4 top-4 text-brand peer-checked:inline">check_circle</span>
          <span class="text-lg font-semibold">Sprout</span>
          <span class="text-2xl font-bold">$4/mo</span>
          <span class="text-sm text-gray-600">5 gardens, weather alerts</span>
        </label>
        <label class="relative flex cursor-pointer flex-col gap-2 rounded-xl border border-gray-300 bg-white p-5 has-checked:border-brand has-checked:bg-brand-soft">
          <input type="radio" name="plan" value="grove" class="peer sr-only">
          <span class="material-symbols-outlined hidden absolute right-4 top-4 text-brand peer-checked:inline">check_circle</span>
          <span class="text-lg font-semibold">Grove</span>
          <span class="text-2xl font-bold">$9/mo</span>
          <span class="text-sm text-gray-600">Unlimited gardens, sharing</span>
        </label>
      </div>
    </fieldset>
    <button type="submit" class="mt-8 h-12 rounded-full bg-brand px-8 font-medium text-white">Continue</button>
  </form>
</main>
</body>
</html>
